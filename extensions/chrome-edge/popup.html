<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NovaLoad Bridge</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; background: #0b0e14; color: #f1f5f9; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; font-size: 11px; color: #94a3b8; margin-top: 8px; }
      input[type="text"], input[type="url"] { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 4px; border-radius: 6px; border: 1px solid #232d3f; background: #121722; color: #f1f5f9; font-size: 12px; }
      button { margin-top: 12px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; }
      .status { margin-top: 8px; font-size: 11px; color: #4ade80; }
    </style>
  </head>
  <body>
    <h1>NovaLoad Bridge</h1>
    <label>Local Endpoint<input id="endpoint" type="url" value="http://127.0.0.1:3000/api/bridge/capture" /></label>
    <label>Pairing Token<input id="token" type="text" placeholder="nl_bridge_..." /></label>
    <label><input id="autoIntercept" type="checkbox" /> Intercept browser downloads</label>
    <button id="save">Save Configuration</button>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
