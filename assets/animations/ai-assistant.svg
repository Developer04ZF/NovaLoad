<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" fill="none" role="img" aria-label="Animated Gemini AI Assistant Character">
  <style>
    .think-dot-1 { animation: dotPulse 1.4s ease-in-out infinite; }
    .think-dot-2 { animation: dotPulse 1.4s ease-in-out 0.25s infinite; }
    .think-dot-3 { animation: dotPulse 1.4s ease-in-out 0.5s infinite; }
    .plan-card { animation: cardSlide 3s ease-in-out infinite; }
    @keyframes dotPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes cardSlide { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .think-dot-1, .think-dot-2, .think-dot-3, .plan-card { animation: none; } }
  </style>
  <rect x="2" y="2" width="436" height="216" rx="18" fill="#0B0E14" stroke="#232D3F" stroke-width="2"/>
  <!-- Novi Thinking Pose -->
  <line x1="100" y1="30" x2="100" y2="48" stroke="#64748B" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="100" cy="27" r="6" fill="#22D3EE"/>
  <path d="M44 84L30 95V117L44 111V84Z" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <path d="M156 84L170 95V117L156 111V84Z" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="46" y="48" width="108" height="96" rx="24" fill="#161D2B" stroke="#334155" stroke-width="2.5"/>
  <rect x="58" y="62" width="84" height="50" rx="14" fill="#090D14" stroke="#1E293B" stroke-width="1.5"/>
  <circle class="think-dot-1" cx="80" cy="87" r="5" fill="#22D3EE"/>
  <circle class="think-dot-2" cx="100" cy="87" r="5" fill="#60A5FA"/>
  <circle class="think-dot-3" cx="120" cy="87" r="5" fill="#3B82F6"/>
  <rect x="74" y="124" width="52" height="8" rx="4" fill="#1D4ED8"/>
  <!-- Preview & Confirm Panel -->
  <g class="plan-card">
    <rect x="194" y="38" width="220" height="134" rx="14" fill="#121722" stroke="#2563EB" stroke-width="2"/>
    <text x="210" y="60" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AI PLAN · PREVIEW &amp; CONFIRM</text>
    <rect x="210" y="72" width="188" height="22" rx="6" fill="#18202F"/>
    <text x="218" y="87" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="10">MOVE → /Archives/build.zip</text>
    <rect x="210" y="100" width="188" height="22" rx="6" fill="#18202F"/>
    <text x="218" y="115" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="10">DEDUPE → duplicate (1).iso</text>
    <rect x="210" y="132" width="90" height="26" rx="6" fill="#2563EB"/>
    <text x="255" y="149" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Approve</text>
    <rect x="308" y="132" width="90" height="26" rx="6" fill="#1E293B"/>
    <text x="353" y="149" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dismiss</text>
  </g>
  <text x="220" y="198" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">OPTIONAL GEMINI AI · METADATA-ONLY · SERVER KEY ISOLATION</text>
</svg>
