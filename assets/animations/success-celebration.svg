<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" fill="none" role="img" aria-label="Animated Success Celebration">
  <style>
    .celebrate-ring { transform-origin: 180px 105px; animation: ringExpand 2.2s ease-out infinite; }
    .sparkle-a { animation: twinkle 1.8s ease-in-out infinite; }
    .sparkle-b { animation: twinkle 1.8s ease-in-out 0.6s infinite; }
    .sparkle-c { animation: twinkle 1.8s ease-in-out 1.1s infinite; }
    @keyframes ringExpand { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .celebrate-ring, .sparkle-a, .sparkle-b, .sparkle-c { animation: none; } }
  </style>
  <rect x="2" y="2" width="356" height="216" rx="18" fill="#0B0E14" stroke="#232D3F" stroke-width="2"/>
  <circle class="celebrate-ring" cx="180" cy="105" r="64" stroke="#10B981" stroke-width="2.5"/>
  <g>
    <line x1="180" y1="26" x2="180" y2="44" stroke="#64748B" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="180" cy="23" r="6.5" fill="#10B981"/>
    <path d="M120 82L104 94V118L120 111V82Z" fill="#1E293B" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M240 82L256 94V118L240 111V82Z" fill="#1E293B" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="122" y="44" width="116" height="102" rx="26" fill="#161D2B" stroke="#10B981" stroke-width="2.5"/>
    <rect x="136" y="60" width="88" height="54" rx="15" fill="#090D14" stroke="#1E293B" stroke-width="2"/>
    <path d="M150 85C153 79 161 79 164 85" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M196 85C199 79 207 79 210 85" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M170 98L177 105L192 90" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="150" y="126" width="60" height="8" rx="4" fill="#059669"/>
  </g>
  <g transform="translate(82 54)">
    <path class="sparkle-a" d="M0 -8L2.5 -2.5L8 0L2.5 2.5L0 8L-2.5 2.5L-8 0L-2.5 -2.5Z" fill="#34D399"/>
  </g>
  <g transform="translate(278 58)">
    <path class="sparkle-b" d="M0 -8L2.5 -2.5L8 0L2.5 2.5L0 8L-2.5 2.5L-8 0L-2.5 -2.5Z" fill="#60A5FA"/>
  </g>
  <g transform="translate(268 150)">
