<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" fill="none" role="img" aria-label="Animated Segmented File Transfer">
  <style>
    .seg-a { animation: segFlowA 2.2s linear infinite; }
    .seg-b { animation: segFlowB 2.2s linear 0.35s infinite; }
    .seg-c { animation: segFlowC 2.2s linear 0.7s infinite; }
    .seg-d { animation: segFlowD 2.2s linear 1.05s infinite; }
    @keyframes segFlowA { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(198px); opacity: 0; } }
    @keyframes segFlowB { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(198px); opacity: 0; } }
    @keyframes segFlowC { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(198px); opacity: 0; } }
    @keyframes segFlowD { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(198px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .seg-a, .seg-b, .seg-c, .seg-d { animation: none; } }
  </style>
  <rect x="2" y="2" width="516" height="216" rx="18" fill="#0B0E14" stroke="#232D3F" stroke-width="2"/>
  <!-- Origin Server -->
  <rect x="26" y="42" width="110" height="136" rx="14" fill="#121722" stroke="#334155" stroke-width="2"/>
  <text x="81" y="66" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ORIGIN HTTPS</text>
  <rect x="40" y="80" width="82" height="18" rx="5" fill="#1E293B"/>
  <rect x="40" y="104" width="82" height="18" rx="5" fill="#1E293B"/>
  <rect x="40" y="128" width="82" height="18" rx="5" fill="#1E293B"/>
  <text x="81" y="164" text-anchor="middle" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="10">Accept-Ranges</text>
  <!-- 4 Segment Lanes -->
  <line x1="142" y1="68" x2="368" y2="68" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="142" y1="96" x2="368" y2="96" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="142" y1="124" x2="368" y2="124" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="142" y1="152" x2="368" y2="152" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <rect class="seg-a" x="148" y="63" width="24" height="10" rx="5" fill="#3B82F6"/>
  <rect class="seg-b" x="148" y="91" width="24" height="10" rx="5" fill="#22D3EE"/>
  <rect class="seg-c" x="148" y="119" width="24" height="10" rx="5" fill="#38BDF8"/>
  <rect class="seg-d" x="148" y="147" width="24" height="10" rx="5" fill="#10B981"/>
  <!-- .part Destination -->
  <rect x="376" y="42" width="118" height="136" rx="14" fill="#121722" stroke="#2563EB" stroke-width="2"/>
  <text x="435" y="66" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">.PART BUFFER</text>
  <rect x="392" y="82" width="86" height="14" rx="4" fill="#2563EB"/>
  <rect x="392" y="102" width="86" height="14" rx="4" fill="#0891B2"/>
  <rect x="392" y="122" width="86" height="14" rx="4" fill="#0284C7"/>
  <rect x="392" y="142" width="86" height="14" rx="4" fill="#059669"/>
  <text x="260" y="202" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">DIRECT BYTE-OFFSET WRITES · SQLITE CHECKPOINTS · SHA-256 VERIFY</text>
</svg>
