name: CI Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web-and-engine:
    name: TypeCheck, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust-core:
    name: Rust Formatting & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check & test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --lib

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required documentation and governance files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f THIRD_PARTY_LICENSES.md
          test -f docs/README.md
      - name: Validate Markdown links, anchors, and SVG assets
        run: npm run docs:validate
