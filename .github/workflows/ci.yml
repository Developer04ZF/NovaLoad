name: CI Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web-and-engine:
    name: TypeCheck, Build, Sidecar, Extensions & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:icons
      - run: npm run build:extensions
      - run: npm run build:sidecar
      - run: npm test
      - run: npm run validate:versions
      - run: npm run validate:extensions
      - run: npm run validate:artifacts

  rust-core:
    name: Rust Formatting, Clippy & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare frontend, icons, and sidecar binary for Tauri build script
        run: |
          npm ci
          npm run build
          npm run build:icons
          npm run build:sidecar
      - name: Cargo format, clippy, and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

  docs-check:
    name: Documentation, Releases & SVG Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required governance and release documentation files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f THIRD_PARTY_LICENSES.md
          test -f docs/README.md
          test -f docs/releases/README.md
          test -f docs/releases/building-releases.md
          test -f docs/releases/platform-support.md
          test -f docs/releases/browser-extensions.md
          test -f docs/releases/code-signing.md
          test -f docs/releases/updating.md
          test -f docs/releases/release-checklist.md
      - name: Validate Markdown links, anchors, scripts, and SVG assets
        run: npm run docs:validate
