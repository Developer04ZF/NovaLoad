name: Bug Report
description: Report a bug in NovaLoad
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: NovaLoad Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10 (x64)
        - Windows (ARM64)
        - Linux (x64)
        - Linux (ARM64)
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps and expected vs actual behavior.
    validations:
      required: true
